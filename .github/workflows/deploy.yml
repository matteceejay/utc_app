name: Deploy to dev

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/deploy.yml"

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: app
        run: pip install -r requirements.txt

      - name: Sanity check the app imports
        working-directory: app
        run: python -c "from app import create_app"

      - name: Package app
        working-directory: app
        run: zip -r ../latest.zip . -x "venv/*" "*.pyc" "__pycache__/*"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Upload artifact to S3
        run: aws s3 cp latest.zip s3://${{ secrets.DEPLOY_BUCKET }}/deploy/latest.zip

      - name: Deploy to instances via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:Name,Values=utc-app-dev-app" \
            --parameters 'commands=["/usr/local/bin/deploy-app.sh"]' \
            --query "Command.CommandId" --output text)

          echo "Command ID: $COMMAND_ID"
          sleep 25
          aws ssm list-command-invocations --command-id "$COMMAND_ID" --details \
            --query 'CommandInvocations[].{Instance:InstanceId,Status:Status}' --output table